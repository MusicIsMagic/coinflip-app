name: Android beta APK

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build the signed APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk coin-flip-challenge-beta.apk
          gh release create "beta-${{ github.run_number }}" coin-flip-challenge-beta.apk \
            --title "Beta ${{ github.run_number }}" \
            --notes "Coin Flip Challenge Android beta build ${{ github.run_number }}." \
            --latest
